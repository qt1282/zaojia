<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>造价口袋通-V8.0 智慧库版</title>
    <style>
        :root { --primary: #007bff; --success: #2ecc71; --danger: #e74c3c; --dark: #2c3e50; --info: #17a2b8; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .box { background: white; width: 100%; max-width: 900px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 95vh; }

        /* 导航 */
        .nav-tabs { display: flex; background: var(--dark); padding: 5px; gap: 5px; flex-shrink: 0; }
        .tab { flex: 1; text-align: center; padding: 12px; color: #fff; cursor: pointer; border-radius: 8px; font-size: 14px; opacity: 0.6; transition: 0.3s; }
        .tab.active { background: var(--primary); opacity: 1; font-weight: bold; }

        .content { flex: 1; display: flex; overflow: hidden; }
        .view { display: none; width: 100%; height: 100%; gap: 10px; padding: 10px; box-sizing: border-box; }
        .view.active { display: flex; }

        /* 布局 */
        .col-lib { flex: 1; border-right: 1px solid #eee; overflow-y: auto; background: #fff; }
        .col-cart { flex: 1.6; overflow-y: auto; background: #fafafa; padding: 10px; }

        .search-bar { padding: 10px; background: #f8f9fa; border-bottom: 1px solid #eee; }
        .search-bar input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; box-sizing: border-box; outline: none; }

        .lib-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .lib-item:hover { background: #e7f1ff; }
        .lib-item b { font-size: 13px; color: var(--dark); display: block; }
        .lib-item small { font-size: 11px; color: #999; }

        /* 清单卡片 */
        .cart-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; }
        .card-name { font-weight: bold; margin-bottom: 10px; font-size: 14px; padding-right: 60px; color: var(--dark); border-bottom: 1px solid #eee; padding-bottom: 5px;}

        .card-ops { position: absolute; right: 10px; top: 10px; display: flex; gap: 8px; }
        .btn-mini { font-size: 11px; cursor: pointer; padding: 2px 5px; border-radius: 4px; border: 1px solid #ddd; }
        .btn-copy { border-color: var(--primary); color: var(--primary); }
        .btn-del { border-color: #ccc; color: #999; }

        .card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .card-grid label { font-size: 10px; color: #999; margin-bottom: 3px; display: block; }
        .card-grid input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; box-sizing: border-box; }

        .pick-link { color: var(--primary); font-size: 10px; text-decoration: underline; cursor: pointer; margin-top: 4px; display: block; text-align: right;}

        /* 价格卡片 */
        .price-card { border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; display: flex; justify-content: space-between; align-items: center; }
        .price-tag { color: var(--danger); font-size: 18px; font-weight: bold; }
        .btn-fill { background: var(--info); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }

        .footer { background: var(--dark); color: #fff; padding: 15px; text-align: center; }
        .total-val { font-size: 32px; color: var(--success); font-weight: bold; }

        #status-msg { font-size: 10px; color: #666; padding: 5px 10px; background: #eee; }

        @media (max-width: 600px) { .view.active { flex-direction: column; } .col-lib, .col-cart { flex: none; height: 50%; } }
    </style>
</head>
<body>

<div class="box">
    <div id="status-msg">正在连接定额仓库...</div>
    <div class="nav-tabs">
        <div class="tab active" id="tab-calc" onclick="switchView('calc')">📈 组价台</div>
        <div class="tab" id="tab-prices" onclick="switchView('prices')">📂 青岛材价库</div>
    </div>

    <div class="content">
        <div id="viewCalc" class="view active">
            <div class="col-lib">
                <div class="search-bar"><input type="text" id="sLib" placeholder="搜定额编号/名称..." oninput="renderLib()"></div>
                <div id="libList"></div>
            </div>
            <div class="col-cart">
                <div id="cartList"></div>
            </div>
        </div>

        <div id="viewPrices" class="view" style="flex-direction:column;">
            <div id="matchBanner" style="display:none; padding:10px; background: #fff3cd; color: #856404; font-size: 12px; border-radius: 8px; margin-bottom: 10px;">🎯 匹配材料：<b id="matchName"></b></div>
            <input type="text" id="sPrice" placeholder="搜索材料..." oninput="renderPrices()" style="width:100%; padding:12px; border-radius:10px; border:2px solid var(--info); margin-bottom:10px; outline:none;">
            <div id="priceLib" style="flex:1; overflow-y:auto;"></div>
        </div>
    </div>

    <div class="footer">
        <div style="font-size:12px; opacity:0.8;">汇总总价 (青岛市政 1.22费率)</div>
        <div class="total-val">¥ <span id="totalNum">0.00</span></div>
    </div>
</div>

<script>
    // --- 1. 材价库 (数据仓库) ---
    // 你可以继续通过 C+D 在这里扩充
    let masterPrices = [
        { "name": "石粉", "price": 64.55, "unit": "m³" },
        { "name": "生石灰", "price": 398.57, "unit": "t" },
        { "name": "细粒式沥青混凝土", "price": 514.32, "unit": "t" },
        { "name": "中粒式沥青混凝土", "price": 460.77, "unit": "t" },
        { "name": "SBS改性沥青混凝土", "price": 544.02, "unit": "t" },
        { "name": "混凝土侧石 300*150", "price": 48.93, "unit": "m" },
        { "name": "钢筋混凝土排水管 D600", "price": 156.38, "unit": "m" }
    ];

    // --- 2. 定额库 (从 JSON 加载) ---
    let library = {};
    let cart = [];
    let matchIdx = null;

    // 连接 road_data.json
    function loadLibrary() {
        fetch('road_data.json')
            .then(res => res.json())
            .then(data => {
                library = data;
                document.getElementById('status-msg').innerHTML = "🟢 定额仓库已就绪 (共 " + Object.keys(data).length + " 条)";
                renderLib();
            })
            .catch(err => {
                document.getElementById('status-msg').innerHTML = "🔴 定额仓库连接失败 (请使用 Live Server 运行)";
                console.error(err);
            });
    }

    // --- 3. 核心逻辑：自动计算单价 ---
    function addDinge(code) {
        const dinge = library[code];

        // 自动配药逻辑：遍历 JSON 里的主要材料，去材价库找价格并累加
        let auto_cl_price = 0;
        if (dinge.mainMaterials) {
            dinge.mainMaterials.forEach(m => {
                const match = masterPrices.find(p => p.name.includes(m.name));
                const price = match ? match.price : 0;
                auto_cl_price += m.consume * price;
            });
        }

        cart.push({
            code: code,
            name: dinge.name,
            unit: dinge.unit,
            qty: 1,
            // 自动计算初始值
            p_rg: dinge.labor * 131, // 消耗量 * 131(青岛单价)
            p_cl: auto_cl_price,    // 自动配药计算出的材料费
            p_jx: 50,               // 机械费预设基数
            rg_base: dinge.labor    // 保留消耗量基数以便换算
        });
        renderCart();
    }

    // --- 4. 界面交互 ---
    function switchView(v) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        document.getElementById('tab-'+v).classList.add('active');
        document.getElementById('view'+v.charAt(0).toUpperCase()+v.slice(1)).classList.add('active');
        if(v === 'prices') renderPrices();
        else { matchIdx = null; document.getElementById('matchBanner').style.display='none'; }
    }

    function renderLib() {
        const kw = document.getElementById('sLib').value.toLowerCase();
        const box = document.getElementById('libList'); box.innerHTML = '';
        for(let k in library) {
            if(!kw || k.includes(kw) || library[k].name.includes(kw)) {
                const d = document.createElement('div');
                d.className = 'lib-item';
                d.innerHTML = `<b>${k}</b>${library[k].name}<br><small>${library[k].unit}</small>`;
                d.onclick = () => addDinge(k);
                box.appendChild(d);
            }
        }
    }

    function renderCart() {
        const box = document.getElementById('cartList');
        box.innerHTML = cart.length ? '' : '<div style="text-align:center;color:#ccc;margin-top:100px;font-size:13px;">← 库中选择定额</div>';
        cart.forEach((item, i) => {
            const d = document.createElement('div');
            d.className = 'cart-card';
            d.innerHTML = `
                <div class="card-ops">
                    <span class="btn-mini btn-copy" onclick="copyItem(${i})">克隆</span>
                    <span class="btn-mini btn-del" onclick="cart.splice(${i},1);renderCart()">×</span>
                </div>
                <div class="card-name">${item.code} ${item.name}</div>
                <div style="font-size:12px;">工程量: <input type="number" value="${item.qty}" oninput="cart[${i}].qty=parseFloat(this.value)||0;calc()" style="width:60px; border:1px solid #ddd;"> ${item.unit}</div>
                <div class="card-grid">
                    <div><label>人工费</label><input type="number" value="${item.p_rg.toFixed(2)}" oninput="cart[${i}].p_rg=parseFloat(this.value)||0;calc()"></div>
                    <div><label>材料费</label><input type="number" value="${item.p_cl.toFixed(2)}" oninput="cart[${i}].p_cl=parseFloat(this.value)||0;calc()"><span class="pick-link" onclick="startMatch(${i})">查价匹配</span></div>
                    <div><label>机械费</label><input type="number" value="${item.p_jx.toFixed(2)}" oninput="cart[${i}].p_jx=parseFloat(this.value)||0;calc()"></div>
                </div>
            `;
            box.appendChild(d);
        });
        calc();
    }

    function copyItem(i) {
        cart.splice(i + 1, 0, { ...cart[i] });
        renderCart();
    }

    function startMatch(i) {
        matchIdx = i; switchView('prices');
        document.getElementById('matchBanner').style.display='block';
        document.getElementById('matchName').innerText = cart[i].name;
    }

    function renderPrices() {
        const kw = document.getElementById('sPrice').value.toLowerCase().trim();
        const box = document.getElementById('priceLib'); box.innerHTML = '';
        masterPrices.forEach(m => {
            if(!kw || m.name.toLowerCase().includes(kw)) {
                const d = document.createElement('div');
                d.className = 'price-card';
                d.innerHTML = `<div><b>${m.name}</b><small>${m.unit}</small></div>
                               <div style="display:flex;align-items:center;"><div class="price-tag">¥${m.price}</div>
                               <button class="btn-fill" onclick="fillPrice(${m.price})">填入</button></div>`;
                box.appendChild(d);
            }
        });
    }

    function fillPrice(p) {
        if(matchIdx !== null) {
            cart[matchIdx].p_cl = p; renderCart(); switchView('calc');
        }
    }

    function calc() {
        let sum = 0;
        cart.forEach(item => {
            const unit = (item.p_rg + item.p_cl + item.p_jx);
            sum += unit * 1.22 * item.qty;
        });
        document.getElementById('totalNum').innerText = sum.toLocaleString('zh-CN',{minimumFractionDigits:2});
    }

    window.onload = () => { loadLibrary(); renderCart(); };
</script>
</body>
</html>
